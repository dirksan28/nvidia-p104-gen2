# Installed by nvidia-srv-p104-gen2.
#
# DKMS re-reads this file on every build (it is sourced after the stock
# dkms.conf), so the patch is applied to current and future kernels and is
# reapplied automatically after a kernel upgrade.
#
# The index MUST be contiguous: stock dkms.conf defines PATCH[0] and PATCH[1],
# and dkms 3.2.2 iterates with  for ((i=0; i < ${#PATCH[@]}; i++)), so a
# sparse index such as PATCH[3] would never be visited. PATCH[2] is free in
# the stock 580.178.04 dkms.conf.
PATCH[2]="p104-gen2.patch"
